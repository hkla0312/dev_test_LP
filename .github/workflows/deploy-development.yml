name: Deploy LP to development server

on:
  push:
    branches:
      - main
    paths:
      - 'LA_LP/**'
      - '.github/workflows/deploy-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-lp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload LP files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Upload to development server
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp --user "$FTP_USERNAME" --password "$FTP_PASSWORD" "ftps://$FTP_SERVER" <<LFTP
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:timeout 60
          set net:max-retries 2
          mirror --reverse --only-newer --verbose --no-perms --parallel=1 LA_LP/ "$FTP_SERVER_DIR"
          bye
          LFTP
