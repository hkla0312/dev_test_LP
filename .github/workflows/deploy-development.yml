name: Deploy LP to development server

on:
  push:
    branches:
      - main
    paths:
      - 'LA_OS/**'
      - 'LA_LP/**'
      - 'LA_Admin/**'
      - 'danmaku-view/**'
      - '.github/workflows/deploy-development.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: development-lp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload LP files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install WebDAV client
        run: sudo apt-get update && sudo apt-get install --yes rclone

      - name: Upload development applications to WebDAV
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
        run: |
          rclone config create lolipop-webdav webdav \
            url "$WEBDAV_URL" \
            vendor other \
            user "$FTP_USERNAME" \
            pass "$(rclone obscure "$FTP_PASSWORD")"
          # Temporary diagnostic deployment: place the applications at the
          # WebDAV/FTP account root to verify both protocols see the same files.
          remote_dir="lolipop-webdav:"
          for app_dir in LA_OS LA_LP LA_Admin danmaku-view; do
            rclone copy "$app_dir/" "$remote_dir/$app_dir" \
              --transfers 1 \
              --checkers 1 \
              --retries 2 \
              --low-level-retries 2 \
              --create-empty-src-dirs \
              --verbose
          done

          echo "Uploaded application folders:"
          rclone lsf "$remote_dir" --dirs-only
